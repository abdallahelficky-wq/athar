# هذا الملف لم يعد يُقرأ فعلياً: Railway انتقل افتراضياً من Nixpacks إلى Railpack (راجع
# railway.json الذي يُثبِّت ذلك صراحةً، وrailpack.json للتثبيت الفعلي لـChromium الآن) —
# Railpack لا يقرأ صيغة nixpacks.toml إطلاقاً، وهذا بالضبط ما سبَّب عطل إنتاج فعلي (فرع
# fix/pdf-chromium-production): هذا الإعلان أدناه كان يبدو صحيحاً لكنه صامتاً بلا أي أثر منذ
# انتقال Railway. يبقى هذا الملف فقط احتياطاً بلا ضرر لو عاد المشروع لاستخدام Nixpacks فعلياً
# مستقبلاً (Railway يعيد أحياناً استخدامه تلقائياً في بعض الحالات الحدّية).
[phases.setup]
nixPkgs = ["chromium"]
