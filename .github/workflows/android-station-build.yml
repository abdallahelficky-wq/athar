name: Android station APK

# تطبيق عامل المحطة (android-station/) — ملف عمل مستقل تماماً عن android-build.yml (تطبيق نقطة
# البيع)، بمسار زناد مقصور على android-station/** فلا يتأثر أحدهما بتعديل الآخر إطلاقاً. ثلاث مهام:
#   1. build        — APK تجريبي (assembleDebug) باسمه الخاص athar-station-*.
#   2. camera-test  — اختبار التصوير الفعلي (app/src/androidTest/CameraCaptureTest.kt) على محاكي
#                     أندرويد حقيقي: السبب الوحيد لوجود هذا التطبيق، فلا يُعتبَر بناءٌ صالحاً دونه.
#   3. publish      — إصدار مثبَّت على وسم يُمرَّر يدوياً (workflow_dispatch + release_tag)، فقط بعد نجاح
#                     المهمّتين السابقتين معاً.

on:
  push:
    paths:
      - "android-station/**"
      - ".github/workflows/android-station-build.yml"
  pull_request:
    paths:
      - "android-station/**"
      - ".github/workflows/android-station-build.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag for a one-off pinned pre-release (e.g. android-station-v1.0). Leave empty to just build and test."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-station
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # نفس ملاحظة android-build.yml: ubuntu-latest يأتي بـAndroid SDK مثبَّت مسبقاً، وAGP يُنزِّل أي
      # platform/build-tools ناقص بنفسه.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/athar-station-debug.apk

      # تحقّق بـaapt2 (من build-tools المثبَّتة على المُشغِّل) أن الـAPK الفعلي هو تطبيق المحطة بالإصدار
      # المُعلَن في build.gradle.kts — لا تطبيق نقطة البيع ولا رقم إصدار قديم — قبل رفعه أو نشره.
      - name: Verify APK identity with aapt2
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          badging="$("$aapt2" dump badging app/build/outputs/apk/debug/athar-station-debug.apk)"
          echo "$badging" | grep -E "^(package|application-label|application):"
          expected_version="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          echo "$badging" | grep -q "^package: name='com.athar.station' " || { echo "::error::wrong applicationId"; exit 1; }
          echo "$badging" | grep -q "versionName='${expected_version}'" || { echo "::error::versionName is not ${expected_version}"; exit 1; }
          sha256sum app/build/outputs/apk/debug/athar-station-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: athar-station-debug-apk
          path: android-station/app/build/outputs/apk/debug/athar-station-debug.apk
          if-no-files-found: error

  camera-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-station
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # تسريع العتاد (KVM) لمحاكي x86_64 على مُشغِّل Linux — بدونه يكون المحاكي أبطأ بكثير من أن يُكمِل.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs before booting the emulator
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Run camera capture tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android-station
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athar-station-camera-test-report
          path: android-station/app/build/reports/androidTests/connected/
          if-no-files-found: ignore

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: [build, camera-test]
    runs-on: ubuntu-latest
    # لازمة فقط لإنشاء الإصدار عبر GITHUB_TOKEN — هذه المهمّة لا تعمل إطلاقاً على pull_request
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: athar-station-debug-apk
          path: apk

      - name: Prepare pinned release asset
        id: pinned_asset
        run: |
          version="${{ inputs.release_tag }}"
          version="${version#android-station-}"
          filename="athar-station-${version}.apk"
          cp apk/athar-station-debug.apk "apk/${filename}"
          echo "filename=${filename}" >> "$GITHUB_OUTPUT"

      # نفس تحقّق aapt2 على الملف الذي سيُنشَر بعينه، مع بصمته (sha256) لمطابقة أي نسخة تُنزَّل منه لاحقاً
      - name: Verify release asset with aapt2
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$aapt2" dump badging "apk/${{ steps.pinned_asset.outputs.filename }}" | grep -E "^(package|application-label|application):"
          sha256sum "apk/${{ steps.pinned_asset.outputs.filename }}"

      - name: Publish pinned pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: "Athar Station (محطة أثر) ${{ inputs.release_tag }}"
          prerelease: true
          files: apk/${{ steps.pinned_asset.outputs.filename }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
